/* Layout: palco de sessão gravada. Pergunta no topo, pessoa e gêmeo lado a lado, placar ao lado. Monocromático, osso e preto. */
:root{
  --bg:#0C0C0E; --palco:#141416; --linha:#2A2A2D; --fg:#F5F4F0; --sub:#9C9B96; --fraco:#5E5D59;
  --acerto:#F5F4F0; --meio:#8E8D88; --erro:#3A3A3D; --inverso:#0C0C0E;
  --f-titulo:"Space Grotesk",system-ui,sans-serif; --f-corpo:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --logo-claro:block; --logo-escuro:none;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F4F0; --palco:#FFFFFF; --linha:#DCDAD3; --fg:#1D1D1B; --sub:#6B6A65; --fraco:#A6A49D;
  --acerto:#1D1D1B; --meio:#8E8D88; --erro:#E4E2DB; --inverso:#F5F4F0; --logo-claro:none; --logo-escuro:block; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F5F4F0; --palco:#FFFFFF; --linha:#DCDAD3; --fg:#1D1D1B; --sub:#6B6A65; --fraco:#A6A49D;
  --acerto:#1D1D1B; --meio:#8E8D88; --erro:#E4E2DB; --inverso:#F5F4F0; --logo-claro:none; --logo-escuro:block; color-scheme:light }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-corpo);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rot{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}

/* topo */
.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--linha);padding-bottom:14px}
.marca{font-family:var(--f-titulo);font-weight:700;font-size:20px;letter-spacing:-.02em}
.marca{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca span{color:var(--sub);font-weight:500;font-size:14px;letter-spacing:0;border-left:1px solid var(--linha);padding-left:14px}
.logo{height:30px;width:auto;max-width:100%}
.lc{display:var(--logo-claro)} .le{display:var(--logo-escuro)}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--sub)}
.ctrl label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ctrl input{accent-color:var(--fg)}
.btn{border:1px solid var(--linha);background:transparent;border-radius:999px;padding:8px 16px;font-size:14px}
.btn:hover{border-color:var(--fg)}
.btn.cheio{background:var(--fg);color:var(--inverso);border-color:var(--fg);font-weight:600}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* abertura */
.abertura{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.abertura h1{font-family:var(--f-titulo);font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.03em;margin:8px 0 18px;text-wrap:balance}
.abertura p{color:var(--sub);max-width:58ch;margin:0 0 12px}
.selo{background:var(--palco);border:1px solid var(--linha);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.selo .hash{font-family:var(--f-mono);font-size:15px;line-height:1.7;word-break:break-all;color:var(--fg)}
.selo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:13px}
.selo dt{color:var(--sub)} .selo dd{margin:0}
.passos{display:flex;flex-direction:column;gap:6px;margin:18px 0 22px;padding:0;list-style:none;counter-reset:p}
.passos li{counter-increment:p;display:flex;gap:12px;color:var(--sub);font-size:14px}
.passos li::before{content:counter(p);font-family:var(--f-mono);color:var(--fg);width:18px}

/* rodada */
.rodada{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.palco{display:flex;flex-direction:column;gap:18px;min-width:0}
.pergunta{background:var(--palco);border:1px solid var(--linha);border-radius:14px;padding:24px 26px}
.pergunta .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pergunta h2{font-family:var(--f-titulo);font-weight:600;font-size:clamp(22px,2.6vw,32px);line-height:1.15;letter-spacing:-.015em;margin:12px 0 0;text-wrap:balance}
.duelo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lado{border:1px solid var(--linha);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:230px}
.lado h3{margin:0;font-family:var(--f-titulo);font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ops{display:flex;flex-direction:column;gap:8px}
.ops.linha{flex-direction:row;flex-wrap:wrap}
.op{text-align:left;border:1px solid var(--linha);background:transparent;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.ops.linha .op{flex:1 1 0;min-width:52px;justify-content:center;text-align:center;flex-direction:column;align-items:center;gap:2px}
.op .k{font-family:var(--f-mono);font-size:11px;color:var(--fraco)}
.op:hover:not(:disabled){border-color:var(--fg)}
.op.on{background:var(--fg);color:var(--inverso);border-color:var(--fg)}
.op.on .k{color:var(--inverso);opacity:.6}
.op:disabled{cursor:default}
textarea{width:100%;min-height:110px;resize:vertical;background:transparent;color:var(--fg);border:1px solid var(--linha);border-radius:10px;padding:12px;font:inherit}
.gemeo{position:relative;overflow:hidden}
.lacre{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;color:var(--sub);border:1px dashed var(--linha);border-radius:10px;padding:18px}
.lacre .mono{font-size:12px;color:var(--fraco);word-break:break-all}
.resp{font-family:var(--f-titulo);font-size:clamp(20px,2.2vw,28px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.resp.txt{font-family:var(--f-corpo);font-size:17px;line-height:1.45}
.veredito{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 12px;border:1px solid var(--linha);align-self:flex-start}
.veredito.v1{background:var(--acerto);color:var(--inverso);border-color:var(--acerto)}
.veredito.v05{border-color:var(--meio)}
.revela{animation:entra .5s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.revela{animation:none}}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dica{font-size:12px;color:var(--fraco)}

/* placar */
.placar{background:var(--palco);border:1px solid var(--linha);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.grande{font-family:var(--f-titulo);font-size:56px;line-height:1;letter-spacing:-.03em;font-weight:700}
.grande small{font-size:18px;color:var(--sub);font-weight:500;margin-left:4px}
.trilha{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.trilha i{display:block;aspect-ratio:1;border-radius:3px;border:1px solid var(--linha);max-width:100%}
.trilha i.s1{background:var(--acerto);border-color:var(--acerto)}
.trilha i.s05{background:linear-gradient(135deg,var(--meio) 50%,transparent 50%);border-color:var(--meio)}
.trilha i.s0{background:var(--erro)}
.trilha i.atual{outline:2px solid var(--fg);outline-offset:1px}
.blocos{display:flex;flex-direction:column;gap:10px}
.bl{display:grid;grid-template-columns:34px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.barra{height:6px;border-radius:3px;background:var(--erro);overflow:hidden}
.barra b{display:block;height:100%;background:var(--acerto);transition:width .4s}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--linha)}

/* final */
.final{display:flex;flex-direction:column;gap:24px}
.final h1{font-family:var(--f-titulo);font-size:clamp(30px,4vw,48px);letter-spacing:-.03em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.num{border:1px solid var(--linha);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.num.destaque{background:var(--fg);color:var(--inverso);border-color:var(--fg)}
.num.destaque .rot,.num.destaque p{color:var(--inverso);opacity:.7}
.num p{margin:0;font-size:13px;color:var(--sub)}
.duas{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.caixa{border:1px solid var(--linha);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.caixa h3{margin:0;font-family:var(--f-titulo);font-size:18px}
.cmp{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.cmp .barra.f b{background:var(--meio)}
.ok{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px}
.ok b{background:var(--fg);color:var(--inverso);border-radius:999px;padding:3px 10px;font-weight:500}
.nota{font-size:12px;color:var(--fraco);max-width:80ch}
.tabela{overflow-x:auto}
.tabela table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tabela th,.tabela td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
.tabela th{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:500}
.tabela td.n{font-family:var(--f-mono);text-align:right}

@media (max-width:900px){
  .rodada,.abertura,.duas{grid-template-columns:1fr}
  .placar{position:static}
  .nums{grid-template-columns:1fr}
}
@media (max-width:620px){ .duelo{grid-template-columns:1fr} .grande{font-size:44px} }
</style>

  const ordem=embaralha(ITENS.slice(0,27).map(x=>x.n-1),seed).concat([27,28,29]);
  S={tela:"abertura",seed,ordem,pos:0,resp:Array(30).fill(null),revelado:Array(30).fill(false),hash:null};
  sha(LACRE_TXT).then(h=>{S.hash=h;desenha()});
  desenha();
}
const $=(s)=>document.querySelector(s);
const tela=$("#tela");
const demo=()=>$("#demo").checked;

function pontosGemeo(){
  let soma=0,n=0; const bl={};
  ITENS.forEach((it,i)=>{
    if(!S.revelado[i]) return;
    const p = it.tipo==="aberta" ? null : pontua(it,S.resp[i],EX.G[i]);
    if(it.tipo==="aberta") return;
    soma+=p;n++; (bl[it.b]=bl[it.b]||{s:0,n:0}); bl[it.b].s+=p; bl[it.b].n++;
  });
  return {soma,n,bl};
}

function desenha(){
  if(S.tela==="abertura") return abertura();
  if(S.tela==="rodada") return rodada();
  return final();
}

function abertura(){
  tela.innerHTML=`
  <section class="abertura">
    <div>
      <div class="rot">Sessão ao vivo · dia 7</div>
      <h1>O gêmeo contra o original.</h1>
      <p>A pessoa responde em voz alta. Depois de cada resposta, a tela revela o que o gêmeo digital dela previu. As previsões foram lacradas antes da sessão e ninguém nesta sala as viu.</p>
      <ol class="passos">
        <li>27 perguntas fechadas, em ordem sorteada agora.</li>
        <li>3 perguntas abertas no fim, pontuadas depois por dois juízes às cegas.</li>
        <li>O placar mostra quanto o gêmeo acertou. O reteste do dia 21 completa o índice.</li>
      </ol>
      <button class="btn cheio" id="comecar" type="button">Abrir o lacre e começar</button>
    </div>
    <aside class="selo">
      <div class="rot">Lacre das previsões</div>
      <div class="hash">${S.hash?grupos(S.hash):"calculando..."}</div>
      <dl>
        <dt>Participante</dt><dd>${PART.nome}</dd>
        <dt>Semente</dt><dd>${PART.entrevista}</dd>
        <dt>Lacrado em</dt><dd class="mono">${PART.selado}</dd>
        <dt>Construtor</dt><dd>${PART.construtor}</dd>
        <dt>Guardião</dt><dd>${PART.guardiao}</dd>
        <dt>Sorteio</dt><dd class="mono">#${S.seed}</dd>
      </dl>
      <p class="nota" style="margin:0">Este código é a impressão digital das 30 previsões. Se uma única letra mudar, o código muda inteiro. Ele é conferido de novo no fim da sessão.</p>
    </aside>
  </section>`;
  $("#comecar").onclick=()=>{S.tela="rodada";desenha()};
}

function rodada(){
  const i=S.ordem[S.pos], it=ITENS[i];
  if(demo() && S.resp[i]==null) S.resp[i]=EX.P[i];
  const r=S.resp[i], rev=S.revelado[i];
  const aberta=it.tipo==="aberta";
  const linha=it.tipo==="escala"||it.tipo==="reais";
  const ops = aberta
    ? `<textarea id="txt" placeholder="A pessoa escreve a resposta antes de ouvir a do gêmeo." ${rev?"disabled":""}>${r||""}</textarea>`
    : `<div class="ops ${linha?"linha":""}">${it.o.map((o,k)=>`<button type="button" class="op ${r===o.v?"on":""}" data-v="${o.v}" ${rev?"disabled":""}>
        <span class="k">${linha?(it.tipo==="escala"?o.v:""):o.v.toUpperCase()}</span><span>${linha?(it.tipo==="escala"?o.t.replace(" totalmente"," tot."):o.t):o.t}</span></button>`).join("")}</div>`;
  let gem;
  if(!rev){
    gem=`<div class="lacre"><div class="rot">Previsão lacrada</div><div>Revela depois que a pessoa responder.</div><div class="mono">${S.hash?S.hash.slice(i*2,i*2+16):""}</div></div>`;
  } else {
    const g=EX.G[i];
    let v="";
    if(aberta){ v=`<span class="veredito">Aguardando os juízes</span>` }
    else { const p=pontua(it,r,g); v=`<span class="veredito ${p===1?"v1":p===.5?"v05":""}">${p===1?"Acertou · 1 ponto":p===.5?"Chegou perto · 0,5":"Errou · 0"}</span>` }
    gem=`<div class="revela" style="display:flex;flex-direction:column;gap:14px">
      <div class="resp ${aberta?"txt":""}">${aberta?"“"+g+"”":(it.tipo==="escala"?g+" · ":"")+rotulo(it,g)}</div>${v}</div>`;
  }
  const pg=pontosGemeo();
  const pct=pg.n?Math.round(pg.soma/pg.n*100):0;
  tela.innerHTML=`
  <section class="rodada">
    <div class="palco">
      <div class="pergunta">
        <div class="meta"><span class="rot">Pergunta ${S.pos+1} de 30 · ${it.b} ${NOMES_BLOCO[it.b]}</span><span class="rot">Item ${it.n} do questionário</span></div>
        <h2>${it.t}</h2>
      </div>
      <div class="duelo">
        <div class="lado"><h3>A pessoa <span class="rot">${aberta?"escreve":"responde em voz alta"}</span></h3>${ops}</div>
        <div class="lado gemeo"><h3>O gêmeo <span class="rot">previsão do dia 6</span></h3>${gem}</div>
      </div>
      <div class="acoes">
        <span class="dica">${aberta?"Enter revela quando o texto estiver escrito.":"Teclas 1 a "+Math.min(it.o.length,9)+" registram a resposta. Enter revela e avança."}</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="volta" type="button" ${S.pos===0?"disabled":""}>Anterior</button>
          ${rev?`<button class="btn cheio" id="prox" type="button">${S.pos===29?"Ver o placar final":"Próxima pergunta"}</button>`
               :`<button class="btn cheio" id="revelar" type="button" ${(r==null||r==="")?"disabled":""}>Revelar o gêmeo</button>`}
        </div>
      </div>
    </div>
    <aside class="placar" aria-live="polite">
      <div>
        <div class="rot">Acerto do gêmeo até aqui</div>
        <div class="grande mono">${pct}<small>%</small></div>
        <div class="dica">${pg.soma.toLocaleString("pt-BR")} pontos em ${pg.n} perguntas fechadas</div>
      </div>
      <div class="trilha">${S.ordem.map((ix,k)=>{const t=ITENS[ix];let c="";if(S.revelado[ix]&&t.tipo!=="aberta"){const p=pontua(t,S.resp[ix],EX.G[ix]);c=p===1?"s1":p===.5?"s05":"s0"}return `<i class="${c} ${k===S.pos?"atual":""}" title="Pergunta ${k+1}"></i>`}).join("")}</div>
      <div class="leg"><span><i style="background:var(--acerto)"></i>acertou</span><span><i style="background:var(--meio)"></i>perto</span><span><i style="background:var(--erro)"></i>errou</span></div>
      <div class="blocos">${["C1","C2","C3","C4"].map(b=>{const x=pg.bl[b];const v=x?Math.round(x.s/x.n*100):null;return `<div class="bl"><span class="mono">${b}</span><div class="barra"><b style="width:${v||0}%"></b></div><span class="mono" style="text-align:right">${v==null?"·":v+"%"}</span></div>`}).join("")}</div>
    </aside>
  </section>`;
  tela.querySelectorAll(".op").forEach(b=>b.onclick=()=>{const v=b.dataset.v;S.resp[i]=isNaN(+v)?v:+v;desenha()});
  const tx=$("#txt"); if(tx){ tx.oninput=()=>{S.resp[i]=tx.value; $("#revelar") && ($("#revelar").disabled=!tx.value.trim())} }
  $("#revelar") && ($("#revelar").onclick=revelar);
  $("#prox") && ($("#prox").onclick=avanca);
  $("#volta").onclick=()=>{S.pos=Math.max(0,S.pos-1);desenha()};
}
function revelar(){ const i=S.ordem[S.pos]; if(S.resp[i]==null||S.resp[i]==="") return; S.revelado[i]=true; desenha(); const p=$("#prox"); p&&p.focus() }
function avanca(){ if(S.pos<29){S.pos++;desenha()} else {S.tela="final";desenha()} }

document.addEventListener("keydown",e=>{
  if(!S||S.tela!=="rodada"||e.target.tagName==="TEXTAREA") return;
  const i=S.ordem[S.pos], it=ITENS[i];
  if(e.key==="Enter"){ e.preventDefault(); S.revelado[i]?avanca():revelar(); return }
  const n=parseInt(e.key,10);
  if(!S.revelado[i] && it.o && !isNaN(n)){ const k=(n===0?10:n)-1; if(it.o[k]){S.resp[i]=it.o[k].v;desenha()} }
});

async function final(){
  // A = gêmeo contra sessão; C = reteste contra sessão; F = gêmeo de perfil contra sessão.
  let A=0,C=0,F=0; const bl={};
  ITENS.forEach((it,i)=>{
    let a,c,f;
    if(it.tipo==="aberta"){ const k=i-27; a=EX.juizes.G[k]; c=EX.juizes.R[k]; f=EX.juizes.F[k] }
    else { a=pontua(it,S.resp[i],EX.G[i])||0; c=pontua(it,S.resp[i],EX.R[i])||0; f=pontua(it,S.resp[i],EX.F[i])||0 }
    A+=a;C+=c;F+=f; (bl[it.b]=bl[it.b]||{a:0,f:0,n:0}); bl[it.b].a+=a; bl[it.b].f+=f; bl[it.b].n++;
  });
  const fmt=(x,d=2)=>x.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  const iG=A/C, iF=F/C;
  const conf=await sha(LACRE_TXT);
  const erros=ITENS.map((it,i)=>({it,i,p:it.tipo==="aberta"?EX.juizes.G[i-27]:pontua(it,S.resp[i],EX.G[i])})).filter(x=>x.p===0).slice(0,4);
  tela.innerHTML=`
  <section class="final">
    <div><div class="rot">Placar final · ${PART.nome}</div><h1>O gêmeo acertou ${Math.round(iG*100)}% do que a pessoa acerta sobre si mesma.</h1></div>
    <div class="nums">
      <div class="num"><span class="rot">Acerto do gêmeo (A)</span><div class="grande mono">${fmt(A/30)}</div><p>${fmt(A,1)} de 30 pontos contra as respostas desta sessão.</p></div>
      <div class="num"><span class="rot">Consistência da pessoa (C)</span><div class="grande mono">${fmt(C/30)}</div><p>${fmt(C,1)} de 30 pontos no reteste do dia 21. Valor de exemplo até o reteste acontecer.</p></div>
      <div class="num destaque"><span class="rot">Índice A dividido por C</span><div class="grande mono">${fmt(iG)}</div><p>O gêmeo de perfil, feito só com dados de cadastro, ficou em ${fmt(iF)}.</p></div>
    </div>
    <div class="duas">
      <div class="caixa">
        <h3>Onde o gêmeo vai bem e onde erra</h3>
        ${["C1","C2","C3","C4","C5"].map(b=>{const x=bl[b];const a=Math.round(x.a/x.n*100),f=Math.round(x.f/x.n*100);return `
          <div class="cmp"><span>${b} ${NOMES_BLOCO[b]}</span><div class="barra"><b style="width:${a}%"></b></div><span class="mono" style="text-align:right">${a}%</span></div>
          <div class="cmp" style="margin-top:-8px"><span class="dica">perfil</span><div class="barra f"><b style="width:${f}%"></b></div><span class="mono dica" style="text-align:right">${f}%</span></div>`}).join("")}
        <div class="leg"><span><i style="background:var(--acerto)"></i>gêmeo completo</span><span><i style="background:var(--meio)"></i>gêmeo só de perfil</span></div>
      </div>
      <div class="caixa">
        <h3>Conferência do lacre</h3>
        <div class="mono" style="font-size:13px;word-break:break-all;color:var(--sub)">${grupos(conf)}</div>
        <div class="ok">${conf===S.hash?"<b>Confere</b> As previsões reveladas são as mesmas lacradas em "+PART.selado+".":"Não confere. As previsões mudaram depois do lacre."}</div>
        <h3 style="margin-top:8px">Pergunta de fechamento</h3>
        <p style="margin:0;font-family:var(--f-titulo);font-size:22px;line-height:1.2">Em que o gêmeo te surpreendeu?</p>
      </div>
    </div>
    ${erros.length?`<div class="caixa"><h3>Erros para comentar</h3><div class="tabela"><table><thead><tr><th>Item</th><th>Pergunta</th><th>Pessoa</th><th>Gêmeo</th></tr></thead><tbody>
      ${erros.map(x=>`<tr><td class="n">${x.it.n}</td><td>${x.it.t}</td><td>${rotulo(x.it,S.resp[x.i])||""}</td><td>${rotulo(x.it,EX.G[x.i])}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div><button class="btn" id="denovo" type="button">Nova sessão</button></div>
    <p class="nota">As três abertas usam notas de exemplo dos juízes. No sistema real, os juízes pontuam numa tela própria sem saber qual resposta é do gêmeo, e o reteste do dia 21 substitui o valor de C.</p>
  </section>`;
  $("#denovo").onclick=novo;
}
$("#reiniciar").onclick=novo;
$("#demo").onchange=()=>{ if(S.tela==="rodada") desenha() };
novo();
</script>
</body></html>
