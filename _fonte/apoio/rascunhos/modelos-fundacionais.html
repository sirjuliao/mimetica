<title>Modelos fundacionais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">

<script>
/* Rascunho do slide "Modelos fundacionais". Textos editáveis abaixo. */
const MODELOS = {
  hero: "Modelos fundacionais de comportamento humano.",
  intro: "Um modelo fundacional de comportamento aprende como as pessoas decidem e responde por elas, em escala. Poucas empresas no mundo operam um modelo próprio.",
  empresas: [
    { nome: "Simile", lugar: "Estados Unidos",
      texto: "Nasceu em Stanford, criada pelos autores da pesquisa que deu origem aos agentes generativos." },
    { nome: "Aaru", lugar: "Estados Unidos",
      texto: "Simula o comportamento de populações para grandes empresas e consultorias globais, como a EY." },
    { nome: "Mimetica", lugar: "Brasil", nossa: true,
      texto: "A empresa brasileira que opera um modelo fundacional proprietário, construído com base no comportamento do brasileiro." }
  ],
  fecho: "Cada população tem o seu jeito de decidir. A Mimetica foi construída sobre o jeito do brasileiro.",
  nota: "Simile e Aaru: informações públicas das empresas."
};
</script>

<style>
:root{
  --osso:#F5F4F0; --preto:#0C0C0E; --texto:#1D1D1B; --texto2:#403F45; --claro2:#C9C7C0;
  --fio:rgba(29,29,27,.18); --moldura:#050506;
  --f-tit:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-txt:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
html,body{height:100%; margin:0}
body{background:var(--moldura); color:var(--texto); font-family:var(--f-txt); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none}
#stage{position:fixed; left:50%; top:50%; width:1600px; height:900px; transform:translate(-50%,-50%); overflow:hidden; background:var(--osso); cursor:pointer}
p,h2,h3{margin:0}
.lbl{position:absolute; top:86px; left:100px; font:600 20px/1 var(--f-mono); letter-spacing:2.5px; text-transform:uppercase; color:var(--texto2)}
.logo-sm{position:absolute; top:80px; right:100px; width:150px; height:auto}
.pag{position:absolute; right:100px; bottom:30px; font:500 16px/1 var(--f-mono); letter-spacing:2px; color:var(--texto2)}
.rascunho{position:absolute; left:100px; bottom:30px; font:500 14px/1 var(--f-mono); letter-spacing:1.5px; text-transform:uppercase; color:#8E8C86}
.hero{position:absolute; left:100px; width:1300px; top:50%; transform:translateY(-50%); font:600 78px/1.08 var(--f-tit); letter-spacing:-1.6px; color:var(--texto); transform-origin:left top; transition:top .8s cubic-bezier(.65,0,.25,1), transform .8s cubic-bezier(.65,0,.25,1), font-size .8s cubic-bezier(.65,0,.25,1)}
.hero.up{top:132px; transform:none; font-size:44px; letter-spacing:-.6px; width:1400px}
.intro{position:absolute; left:100px; top:200px; width:1050px; font-size:22px; line-height:1.45; color:var(--texto2); opacity:0; transition:opacity .6s .3s}
.intro.on{opacity:1}
.grade{position:absolute; left:100px; right:100px; top:285px; display:grid; grid-template-columns:repeat(3,1fr); gap:28px}
.emp{position:relative; border:1px solid var(--fio); border-radius:6px; background:#FBFAF7; padding:0 0 26px; overflow:hidden; opacity:0; transform:translateY(18px); transition:opacity .6s, transform .6s; transition-delay:calc(var(--k) * 180ms)}
.emp.on{opacity:1; transform:none}
.emp canvas{display:block; width:100%; height:240px}
.emp .cab{display:flex; align-items:baseline; justify-content:space-between; padding:18px 26px 0}
.emp h3{font:600 34px/1.1 var(--f-tit); letter-spacing:-.6px; color:var(--texto)}
.emp .lugar{font:500 14px/1 var(--f-mono); letter-spacing:1.4px; text-transform:uppercase; color:var(--texto2)}
.emp p.t{padding:12px 26px 0; font-size:21px; line-height:1.45; color:var(--texto2)}
.emp.nossa{background:var(--preto); border-color:var(--preto)}
.emp.nossa h3{color:var(--osso)}
.emp.nossa .lugar{color:var(--claro2)}
.emp.nossa p.t{color:#E4E2DC}
.nota{position:absolute; left:100px; top:745px; font:500 13px/1.4 var(--f-mono); letter-spacing:.6px; color:#8E8C86; opacity:0; transition:opacity .5s}
.nota.on{opacity:1}
.fecho{position:absolute; left:100px; right:100px; bottom:70px; background:var(--preto); border-radius:4px; padding:22px 34px; opacity:0; transform:translateY(12px); transition:opacity .5s, transform .5s}
.fecho.on{opacity:1; transform:none}
.fecho p{font:600 28px/1.3 var(--f-tit); color:var(--osso)}
#barra{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(128,128,128,.18)}
#barra i{display:block; height:100%; width:0; background:#8E8C86; transition:width .35s}
#dica{position:absolute; left:50%; bottom:58px; transform:translateX(-50%); background:rgba(12,12,14,.9); color:var(--osso); font:500 13px/1 var(--f-mono); padding:11px 16px; border-radius:4px; transition:opacity .6s; white-space:nowrap; z-index:5}
#dica.sai{opacity:0}

html.retrato #stage{width:900px; height:1800px}
html.retrato .lbl{top:62px; left:60px; font-size:26px; letter-spacing:3px}
html.retrato .logo-sm{top:52px; right:60px; width:170px}
html.retrato .pag{right:60px; bottom:34px; font-size:24px}
html.retrato .rascunho{left:60px; bottom:34px; font-size:20px}
html.retrato .hero{left:60px; width:780px; font-size:86px}
html.retrato .hero.up{top:128px; transform:none; font-size:54px; letter-spacing:-.8px; line-height:1.12}
html.retrato .intro{left:60px; top:330px; width:780px; font-size:30px}
html.retrato .grade{left:60px; right:60px; top:560px; grid-template-columns:1fr; gap:22px}
html.retrato .emp{display:grid; grid-template-columns:260px 1fr; padding:0}
html.retrato .emp canvas{grid-row:1 / span 2; width:260px; height:100%; min-height:230px}
html.retrato .emp .cab{padding:24px 26px 0; flex-direction:column; gap:10px}
html.retrato .emp h3{font-size:42px}
html.retrato .emp .lugar{font-size:18px}
html.retrato .emp p.t{padding:12px 26px 24px; font-size:26px}
html.retrato .nota{left:60px; top:auto; bottom:330px; font-size:18px}
html.retrato .fecho{left:60px; right:60px; bottom:110px; padding:30px 36px}
html.retrato .fecho p{font-size:36px}
html.retrato #dica{bottom:90px; font-size:24px; padding:18px 24px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div id="stage">
  <p class="lbl">Modelos fundacionais</p>
  <img class="logo-sm" src="__LOGO_ESCURO__" alt="Mimetica">
  <h2 class="hero" id="hero"></h2>
  <p class="intro" id="intro"></p>
  <div class="grade" id="grade"></div>
  <p class="nota" id="nota"></p>
  <div class="fecho" id="fecho"><p id="fechoP"></p></div>
  <p class="rascunho">Rascunho</p>
  <p class="pag">04</p>
  <div id="barra"><i></i></div>
  <div id="dica">← → ou clique para avançar</div>
</div>

<script>
(() => {
  const M = MODELOS, $ = id => document.getElementById(id), PASSOS = 3;
  $('hero').textContent = M.hero; $('intro').textContent = M.intro; $('fechoP').textContent = M.fecho; $('nota').textContent = M.nota;
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const nuvens = [];
  M.empresas.forEach((e, k) => {
    const d = document.createElement('div'); d.className = 'emp' + (e.nossa ? ' nossa' : ''); d.style.setProperty('--k', e.nossa ? 0 : k);
    d.innerHTML = '<canvas width="900" height="480"></canvas><div class="cab"><h3></h3><span class="lugar"></span></div><p class="t"></p>';
    d.querySelector('h3').textContent = e.nome; d.querySelector('.lugar').textContent = e.lugar; d.querySelector('.t').textContent = e.texto;
    $('grade').appendChild(d);
    /* nuvem de pontos: uma população; a da Mimetica é mais densa */
    const r = rng(11 + k * 7), n = e.nossa ? 520 : 300, pts = [];
    for (let i = 0; i < n; i++){ const a = r() * Math.PI * 2, raio = Math.sqrt(r()); pts.push({ a, raio, f: .4 + r() * .9, s: 2.2 + r() * 2.6, tom: r() }); }
    nuvens.push({ cv: d.querySelector('canvas'), pts, nossa: !!e.nossa, el: d });
  });
  let t0 = performance.now();
  function desenha(now){
    const t = (now - t0) / 1000;
    nuvens.forEach(N => { if (!N.el.classList.contains('on')) return;
      const c = N.cv.getContext('2d'), W = N.cv.width, H = N.cv.height; c.clearRect(0, 0, W, H);
      const cx = W/2, cy = H/2, rx = W*.34, ry = H*.36;
      N.pts.forEach(p => { const ang = p.a + Math.sin(t * .35 * p.f + p.a * 3) * .08, rr = p.raio * (1 + Math.sin(t * .6 * p.f + p.a) * .03);
        const x = cx + Math.cos(ang) * rr * rx, y = cy + Math.sin(ang) * rr * ry;
        c.fillStyle = N.nossa ? (p.tom < .25 ? '#8E8C86' : '#F5F4F0') : (p.tom < .3 ? '#C9C7C0' : p.tom < .7 ? '#8E8C86' : '#403F45');
        c.beginPath(); c.arc(x, y, p.s, 0, 7); c.fill(); }); });
    requestAnimationFrame(desenha);
  }
  requestAnimationFrame(desenha);
  let passo = 0;
  function render(){
    $('hero').classList.toggle('up', passo >= 1); $('intro').classList.toggle('on', passo >= 1);
    [...$('grade').children].forEach((d, k) => d.classList.toggle('on', M.empresas[k].nossa ? passo >= 2 : passo >= 1));
    $('nota').classList.toggle('on', passo >= 1 && passo < 3); $('fecho').classList.toggle('on', passo >= 3);
    $('barra').firstChild.style.width = (passo / PASSOS * 100) + '%'; }
  function prox(){ if (passo < PASSOS){ passo++; render(); dica(); } }
  function ant(){ if (passo > 0){ passo--; render(); dica(); } }
  let dicaFeita = false; function dica(){ if (!dicaFeita){ dicaFeita = true; $('dica').classList.add('sai'); } } setTimeout(dica, 7000);
  addEventListener('keydown', e => { if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); prox(); } else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); ant(); } });
  $('stage').addEventListener('click', e => { (e.clientX < innerWidth * .3) ? ant() : prox(); });
  let tx = null; $('stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
  $('stage').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 40){ dx < 0 ? prox() : ant(); } }, { passive:true });
  const retrato = () => innerHeight > innerWidth && Math.min(screen.width, screen.height) <= 820;
  function fit(){ const r = retrato(); document.documentElement.classList.toggle('retrato', r);
    const Wd = r ? 900 : 1600, Hd = r ? 1800 : 900; $('stage').style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth/Wd, innerHeight/Hd)})`;
    if (r) $('dica').textContent = 'Toque para avançar · toque à esquerda para voltar'; }
  addEventListener('resize', fit); fit();
  try { const m = location.hash.match(/^#p(\d+)$/); if (m){ passo = Math.min(PASSOS, +m[1]); dica(); } } catch(e){}
  render();
})();
</script>
