<title>Cidade do Tema</title>

<script>
/* Rascunho do slide "Cidade do tema". Textos editáveis abaixo. */
const CIDADE = {
  tema: "GLP-1",
  hero: "Para cada tema, os gêmeos digitais se mudam para uma cidade.",
  passos: [
    null,
    { rot: "A cidade do tema", tit: "Cada tema ganha uma cidade.",
      txt: "Aqui, a cidade do GLP-1. É nela que os gêmeos digitais vão viver o assunto, todos os dias." },
    { rot: "Os moradores", tit: "A população artificial se muda para lá.",
      txt: "Milhares de gêmeos digitais, com a mesma composição do Brasil, passam a morar na cidade do tema." },
    { rot: "O que circula na cidade", tit: "Tudo o que importa sobre o tema chega à cidade.",
      lista: [
        ["Banca", "notícias, estudos e literatura do tema"],
        ["Praça", "conversas das redes e das comunidades"],
        ["Loja", "dados da sua empresa: vendas, cadastro, atendimento"],
        ["Casas", "questionários respondidos por pessoas reais"]
      ] },
    { rot: "Os moradores conversam", tit: "Um influencia o outro, como numa cidade de verdade.",
      txt: "Quem ouve na praça que um produto funciona passa a considerar experimentar. A opinião se espalha de pessoa para pessoa." },
    { rot: "Chega uma novidade", tit: "Um assunto novo chega, e a população reage.",
      txt: "Uma notícia aparece na banca e se espalha pela cidade. Os gêmeos digitais atualizam o que pensam, e a leitura do tema continua atual." },
    { rot: "", tit: "", txt: "" }
  ],
  fecho: "Tudo vira contexto para os gêmeos digitais.",
  fechoSub: "Quanto mais dados a empresa traz, mais rápido a cidade aprende."
};
</script>

<style>
:root{
  --osso:#F5F4F0; --preto:#0C0C0E; --texto:#1D1D1B; --texto2:#403F45; --claro2:#C9C7C0;
  --fio:rgba(29,29,27,.18); --moldura:#050506;
  --f-tit:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-txt:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
html,body{height:100%; margin:0}
body{background:var(--moldura); color:var(--texto); font-family:var(--f-txt); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none}
#stage{position:fixed; left:50%; top:50%; width:1600px; height:900px; transform:translate(-50%,-50%); overflow:hidden; background:var(--osso); cursor:pointer}
p,h2,h3{margin:0}
.lbl{position:absolute; top:86px; left:100px; font:600 20px/1 var(--f-mono); letter-spacing:2.5px; text-transform:uppercase; color:var(--texto2)}
.logo-sm{position:absolute; top:80px; right:100px; width:150px; height:auto}
.pag{position:absolute; right:100px; bottom:30px; font:500 16px/1 var(--f-mono); letter-spacing:2px; color:var(--texto2)}
.rascunho{position:absolute; left:100px; bottom:30px; font:500 14px/1 var(--f-mono); letter-spacing:1.5px; text-transform:uppercase; color:#8E8C86}
.hero{position:absolute; left:100px; width:1300px; top:50%; transform:translateY(-50%); font:600 78px/1.08 var(--f-tit); letter-spacing:-1.6px; color:var(--texto); transition:opacity .5s}
.hero.fora{opacity:0}
#cidade{position:absolute; left:580px; top:170px; width:920px; height:640px; opacity:0; transition:opacity .6s}
#cidade.on{opacity:1}
.painel{position:absolute; left:100px; top:200px; width:430px; display:flex; flex-direction:column; gap:16px; opacity:0; transition:opacity .4s}
.painel.on{opacity:1}
.painel.troca{animation:sobe .45s ease both}
@keyframes sobe{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.rot{font:600 15px/1 var(--f-mono); letter-spacing:2.5px; text-transform:uppercase; color:var(--texto2)}
.tit{font:600 40px/1.12 var(--f-tit); letter-spacing:-.6px; color:var(--texto)}
.txt{font-size:21px; line-height:1.48; color:var(--texto2)}
.lista{display:flex; flex-direction:column; gap:14px; margin-top:4px}
.it{display:grid; grid-template-columns:80px 1fr; gap:12px; align-items:baseline; border-top:1px solid var(--fio); padding-top:12px; opacity:0; transform:translateY(8px); transition:opacity .45s, transform .45s}
.it.on{opacity:1; transform:none}
.it b{font:600 15px/1.3 var(--f-mono); letter-spacing:1.5px; text-transform:uppercase; color:var(--texto)}
.it span{font-size:19px; line-height:1.4; color:var(--texto2)}
.fecho{position:absolute; left:100px; right:100px; bottom:66px; background:var(--preto); border-radius:4px; padding:24px 34px; opacity:0; transform:translateY(12px); transition:opacity .5s, transform .5s}
.fecho.on{opacity:1; transform:none}
.fecho p{font:600 28px/1.3 var(--f-tit); color:var(--osso)}
.fecho small{display:block; margin-top:6px; font:500 18px/1.4 var(--f-txt); color:var(--claro2)}
.pips{position:absolute; left:100px; right:100px; bottom:22px; display:none}
#barra{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(128,128,128,.18)}
#barra i{display:block; height:100%; width:0; background:#8E8C86; transition:width .35s}
#dica{position:absolute; left:50%; bottom:58px; transform:translateX(-50%); background:rgba(12,12,14,.9); color:var(--osso); font:500 13px/1 var(--f-mono); padding:11px 16px; border-radius:4px; transition:opacity .6s; white-space:nowrap}
#dica.sai{opacity:0}

/* celular em pé */
html.retrato #stage{width:900px; height:1800px}
html.retrato .lbl{top:62px; left:60px; font-size:26px; letter-spacing:3px}
html.retrato .logo-sm{top:52px; right:60px; width:170px}
html.retrato .pag{right:60px; bottom:34px; font-size:24px}
html.retrato .rascunho{left:60px; bottom:34px; font-size:20px}
html.retrato .hero{left:60px; width:780px; font-size:86px}
html.retrato #cidade{left:0; top:150px; width:900px; height:626px}
html.retrato .painel{left:60px; top:820px; width:780px; gap:20px}
html.retrato .rot{font-size:24px; letter-spacing:3px}
html.retrato .tit{font-size:60px; line-height:1.08}
html.retrato .txt{font-size:37px; line-height:1.42}
html.retrato .it{grid-template-columns:150px 1fr; gap:16px; padding-top:16px}
html.retrato .it b{font-size:24px}
html.retrato .it span{font-size:33px}
html.retrato .fecho{left:60px; right:60px; bottom:90px; padding:30px 36px}
html.retrato .fecho p{font-size:40px}
html.retrato .fecho small{font-size:30px; margin-top:10px}
html.retrato #dica{bottom:90px; font-size:24px; padding:18px 24px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>

<div id="stage">
  <p class="lbl">Cidade do tema</p>
  <img class="logo-sm" src="__LOGO_ESCURO__" alt="Mimetica">
  <h2 class="hero" id="hero"></h2>
  <canvas id="cidade" width="1840" height="1280" aria-label="Mapa de uma cidade fictícia com gêmeos digitais"></canvas>
  <div class="painel" id="painel"><p class="rot" id="rot"></p><p class="tit" id="tit"></p><p class="txt" id="txt"></p><div class="lista" id="lista"></div></div>
  <div class="fecho" id="fecho"><p id="fechoP"></p><small id="fechoS"></small></div>
  <p class="rascunho">Rascunho</p>
  <p class="pag">04</p>
  <div id="barra"><i></i></div>
  <div id="dica">← → ou clique para avançar</div>
</div>

<script>
(() => {
  const C = CIDADE, PASSOS = C.passos.length - 1;
  const $ = id => document.getElementById(id);
  $('hero').textContent = C.hero; $('fechoP').textContent = C.fecho; $('fechoS').textContent = C.fechoSub;
  C.passos[3].lista.forEach(([a, b], i) => { const d = document.createElement('div'); d.className = 'it'; d.style.transitionDelay = (i * 700) + 'ms';
    d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = a; d.lastChild.textContent = b; $('lista').appendChild(d); });

  /* ---------- mapa ---------- */
  const cv = $('cidade'), c = cv.getContext('2d'), W = 920, H = 640;
  const XS = [70, 200, 330, 460, 590, 720, 850], YS = [70, 195, 320, 445, 570];
  const lerp = (a, b, t) => a + (b - a) * t, clamp = v => v < 0 ? 0 : v > 1 ? 1 : v, ease = t => 1 - Math.pow(1 - t, 3);
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const blk = (i, j) => ({ x: XS[i] + 14, y: YS[j] + 14, w: XS[i+1] - XS[i] - 28, h: YS[j+1] - YS[j] - 28 });
  const centro = (i, j) => ({ x: (XS[i] + XS[i+1]) / 2, y: (YS[j] + YS[j+1]) / 2 });
  const LUG = [
    { nome: "BANCA", b: [1, 0], rota: [[460, -12], [460, 70], [265, 70], [265, 132]] },
    { nome: "PRAÇA", b: [3, 1], rota: [[935, 195], [850, 195], [590, 195], [525, 195], [525, 257]] },
    { nome: "LOJA",  b: [4, 3], rota: [[720, 655], [720, 570], [655, 570], [655, 507]] },
    { nome: "CASAS", b: [0, 2], rota: [[-12, 320], [70, 320], [135, 320], [135, 382]] }
  ];
  const ENTRADAS = [[[ -12, 320], [0, 2]], [[935, 195], [6, 1]], [[460, -12], [3, 0]], [[720, 655], [5, 4]]];
  const PRACA = centro(3, 1), BANCA = centro(1, 0);

  /* moradores: andam pelas ruas (grade), de esquina em esquina */
  const N = 170, gente = [];
  for (let k = 0; k < N; k++) gente.push({ i: 0, j: 0, ni: 0, nj: 0, p: 0, v: .006 + rnd() * .008, x: 0, y: 0, tom: rnd() * .2, novo: 0, ent: null, atraso: rnd() * 2200, aqui: false });
  function vizinho(g, puxa){
    const op = [[1,0],[-1,0],[0,1],[0,-1]].map(([a, b]) => [g.i + a, g.j + b]).filter(([a, b]) => a >= 0 && a < XS.length && b >= 0 && b < YS.length);
    if (puxa && rnd() < .3){ op.sort((A, B) => Math.hypot(XS[A[0]] - PRACA.x, YS[A[1]] - PRACA.y) - Math.hypot(XS[B[0]] - PRACA.x, YS[B[1]] - PRACA.y)); return op[0]; }
    return op[Math.floor(rnd() * op.length)];
  }
  function chegaJa(g){ g.i = Math.floor(rnd() * XS.length); g.j = Math.floor(rnd() * YS.length); [g.ni, g.nj] = vizinho(g); g.p = rnd(); g.aqui = true; g.ent = null; }
  function entrar(g){ const e = ENTRADAS[Math.floor(rnd() * ENTRADAS.length)]; g.ent = { x0: e[0][0], y0: e[0][1], i: e[1][0], j: e[1][1], p: 0 }; g.aqui = false; }

  let passo = 0, t0 = performance.now(), espalhou = false;
  const pacotes = []; const ultimo = [0, 0, 0, 0];
  const semente = new Set(); while (semente.size < 10) semente.add(Math.floor(rnd() * N));

  function pontoRota(r, u){
    const seg = []; let tot = 0;
    for (let k = 1; k < r.length; k++){ const d = Math.hypot(r[k][0] - r[k-1][0], r[k][1] - r[k-1][1]); seg.push(d); tot += d; }
    let alvo = u * tot;
    for (let k = 0; k < seg.length; k++){ if (alvo <= seg[k]){ const t = alvo / seg[k]; return [lerp(r[k][0], r[k+1][0], t), lerp(r[k][1], r[k+1][1], t)]; } alvo -= seg[k]; }
    return r[r.length - 1];
  }

  function desenha(now){
    const e = now - t0;
    c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, W, H);
    /* estradas que saem da cidade */
    c.strokeStyle = "#D6D4CD"; c.lineWidth = 10; c.lineCap = "butt";
    [[[-12,320],[70,320]], [[850,195],[935,195]], [[460,-12],[460,70]], [[720,570],[720,655]]].forEach(([a, b]) => { c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); });
    /* ruas */
    c.strokeStyle = "#E2E0DA"; c.lineWidth = 10;
    XS.forEach(x => { c.beginPath(); c.moveTo(x, YS[0]); c.lineTo(x, YS[YS.length-1]); c.stroke(); });
    YS.forEach(y => { c.beginPath(); c.moveTo(XS[0], y); c.lineTo(XS[XS.length-1], y); c.stroke(); });
    /* quarteirões */
    for (let i = 0; i < XS.length - 1; i++) for (let j = 0; j < YS.length - 1; j++){
      const b = blk(i, j), lugar = LUG.findIndex(L => L.b[0] === i && L.b[1] === j);
      if (lugar === 1) continue;
      c.fillStyle = "#ECEAE4"; c.fillRect(b.x, b.y, b.w, b.h);
      c.strokeStyle = "rgba(29,29,27,.10)"; c.lineWidth = 1; c.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    }
    /* lugares */
    LUG.forEach((L, k) => {
      const a = passo >= 3 ? clamp(((passo === 3 ? e : 9999) - k * 700) / 500) : 0;
      const b = blk(L.b[0], L.b[1]), ct = centro(L.b[0], L.b[1]);
      c.globalAlpha = .25 + .75 * a;
      if (k === 1){ c.strokeStyle = "#1D1D1B"; c.lineWidth = 1.2; c.setLineDash([3, 4]); c.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1); c.setLineDash([]);
        c.beginPath(); c.arc(ct.x, ct.y, 26, 0, Math.PI * 2); c.stroke(); }
      else if (k === 3){ for (let q = 0; q < 4; q++){ const hx = b.x + 12 + (q % 2) * (b.w / 2), hy = b.y + 10 + Math.floor(q / 2) * (b.h / 2);
          c.fillStyle = a > 0 ? "#1D1D1B" : "#C9C7C0"; c.fillRect(hx, hy, b.w / 2 - 24, b.h / 2 - 20); } }
      else { c.fillStyle = a > 0 ? "#1D1D1B" : "#C9C7C0"; c.fillRect(b.x + 18, b.y + 16, b.w - 36, b.h - 32); }
      c.globalAlpha = a; c.font = "600 14px 'JetBrains Mono', monospace"; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillStyle = (k === 0 || k === 2) ? "#F5F4F0" : "#1D1D1B";
      if (k === 1) c.fillText(L.nome, ct.x, b.y + b.h - 10); else if (k === 3) { c.fillStyle = "#1D1D1B"; c.fillText(L.nome, ct.x, b.y + b.h + 2); } else c.fillText(L.nome, ct.x, ct.y);
      c.globalAlpha = 1;
      /* pacotes de informação chegando */
      if (passo >= 3 && a >= 1 && now - ultimo[k] > 520){ ultimo[k] = now; pacotes.push({ k, t: now }); }
    });
    for (let q = pacotes.length - 1; q >= 0; q--){ const P = pacotes[q], u = (now - P.t) / 1900; if (u >= 1){ pacotes.splice(q, 1); continue; }
      const [x, y] = pontoRota(LUG[P.k].rota, ease(u)); c.globalAlpha = Math.min(1, (1 - u) * 3); c.fillStyle = "#1D1D1B"; c.fillRect(x - 3.5, y - 3.5, 7, 7); c.globalAlpha = 1; }
    /* novidade: onda saindo da banca */
    if (passo >= 5){ const u = passo === 5 ? e : 1e9, r = u / 1.7;
      if (r < 1100){ c.strokeStyle = "rgba(29,29,27," + Math.max(0, .5 - r / 2200) + ")"; c.lineWidth = 2; c.beginPath(); c.arc(BANCA.x, BANCA.y, r, 0, Math.PI * 2); c.stroke(); }
      const pul = .5 + .5 * Math.sin(now / 260), bb = blk(1, 0);
      c.globalAlpha = .7 + .3 * pul; c.fillStyle = "#1D1D1B"; c.font = "600 13px 'JetBrains Mono', monospace"; c.textAlign = "center";
      c.fillRect(BANCA.x - 66, bb.y - 30, 132, 24); c.fillStyle = "#F5F4F0"; c.fillText("NOVA NOTÍCIA", BANCA.x, bb.y - 18); c.globalAlpha = 1;
      gente.forEach(g => { if (g.aqui && !g.novo && Math.hypot(g.x - BANCA.x, g.y - BANCA.y) < r) g.novo = now; });
    }
    /* moradores */
    const conversa = passo >= 4;
    gente.forEach((g, k) => {
      if (passo < 2) return;
      if (g.ent){ if (e < g.atraso && passo === 2){ return; }
        g.ent.p += .012; const tx = XS[g.ent.i], ty = YS[g.ent.j];
        g.x = lerp(g.ent.x0, tx, ease(clamp(g.ent.p))); g.y = lerp(g.ent.y0, ty, ease(clamp(g.ent.p)));
        if (g.ent.p >= 1){ g.i = g.ent.i; g.j = g.ent.j; [g.ni, g.nj] = vizinho(g); g.p = 0; g.ent = null; g.aqui = true; }
      } else if (g.aqui){
        g.p += g.v; if (g.p >= 1){ g.i = g.ni; g.j = g.nj; [g.ni, g.nj] = vizinho(g, conversa); g.p = 0; }
        const lado = ((k % 7) - 3) * 2.2;
        g.x = lerp(XS[g.i], XS[g.ni], g.p) + (g.j === g.nj ? 0 : lado); g.y = lerp(YS[g.j], YS[g.nj], g.p) + (g.i === g.ni ? 0 : lado);
      } else return;
      const tom = g.tom, cor = Math.round(lerp(158, 29, tom));
      c.fillStyle = `rgb(${cor},${cor - 2},${Math.round(cor * .97)})`; c.beginPath(); c.arc(g.x, g.y, 4.6, 0, Math.PI * 2); c.fill();
      if (g.novo){ const u = clamp((now - g.novo) / 500); c.strokeStyle = "#1D1D1B"; c.lineWidth = 1.3; c.globalAlpha = u; c.beginPath(); c.arc(g.x, g.y, 4.2 + 3.6 * u, 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1; }
    });
    /* conversa: perto da praça, a opinião passa de um para o outro */
    if (conversa){
      gente.forEach((g, k) => { if (semente.has(k)) g.tom = Math.max(g.tom, passo === 4 ? clamp(e / 800) : 1); });
      for (let a = 0; a < N; a++){ const A = gente[a]; if (!A.aqui || A.tom < .6) continue;
        for (let b = 0; b < N; b++){ const B = gente[b]; if (a === b || !B.aqui || B.tom >= A.tom) continue;
          const d = Math.hypot(A.x - B.x, A.y - B.y), naPraca = Math.hypot(B.x - PRACA.x, B.y - PRACA.y) < 150;
          if (d < 16 && naPraca){ B.tom = Math.min(A.tom, B.tom + .012);
            if (d < 16 && B.tom < .9){ c.strokeStyle = "rgba(29,29,27,.35)"; c.lineWidth = 1; c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(B.x, B.y); c.stroke(); } } } }
    }
    /* legenda */
    c.font = "500 13px 'JetBrains Mono', monospace"; c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "#403F45";
    c.fillText("Cidade do tema · " + C.tema.toUpperCase(), 0, 16);
    if (passo >= 2){ c.textAlign = "right"; c.fillText(passo >= 4 ? "cada ponto, um gêmeo digital · mais escuro, mais propenso a experimentar" : "cada ponto, um gêmeo digital", W, 632); }
  }
  let rodando = true;
  (function loop(now){ if (rodando) desenha(now); requestAnimationFrame(loop); })(performance.now());

  /* ---------- passos ---------- */
  function render(instant){
    t0 = instant ? performance.now() - 1e6 : performance.now();
    $('hero').classList.toggle('fora', passo >= 1);
    $('cidade').classList.toggle('on', passo >= 1);
    $('fecho').classList.toggle('on', passo >= 6);
    const P = C.passos[passo], pn = $('painel');
    pn.classList.toggle('on', passo >= 1 && passo <= 5);
    if (P && passo <= 5){ $('rot').textContent = P.rot; $('tit').textContent = P.tit; $('txt').textContent = P.txt || ''; $('txt').style.display = P.txt ? '' : 'none';
      $('lista').style.display = P.lista ? '' : 'none'; pn.classList.remove('troca'); void pn.offsetWidth; pn.classList.add('troca'); }
    document.querySelectorAll('.it').forEach(el => { el.classList.remove('on'); if (passo === 3) requestAnimationFrame(() => el.classList.add('on')); });
    if (passo >= 2) gente.forEach(g => { if (!g.aqui && !g.ent){ if (passo === 2 && !instant) entrar(g); else chegaJa(g); } });
    if (passo < 2) gente.forEach(g => { g.aqui = false; g.ent = null; });
    if (passo < 4) gente.forEach(g => g.tom = Math.min(g.tom, .2));
    if (passo < 5) gente.forEach(g => g.novo = 0);
    $('barra').firstChild.style.width = (passo / PASSOS * 100) + '%';
  }
  function prox(){ if (passo < PASSOS){ passo++; render(); dica(); } }
  function ant(){ if (passo > 0){ passo--; render(true); dica(); } }
  let dicaFeita = false; function dica(){ if (!dicaFeita){ dicaFeita = true; $('dica').classList.add('sai'); } } setTimeout(dica, 6000);
  addEventListener('keydown', e => { if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); prox(); } else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); ant(); } });
  $('stage').addEventListener('click', e => { (e.clientX < innerWidth * .3) ? ant() : prox(); });
  let tx = null; $('stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
  $('stage').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 40){ dx < 0 ? prox() : ant(); } }, { passive:true });

  const retrato = () => innerHeight > innerWidth && Math.min(screen.width, screen.height) <= 820;
  function fit(){ const r = retrato(); document.documentElement.classList.toggle('retrato', r);
    const Wd = r ? 900 : 1600, Hd = r ? 1800 : 900; $('stage').style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth/Wd, innerHeight/Hd)})`;
    if (r) $('dica').textContent = 'Toque para avançar'; }
  addEventListener('resize', fit); fit();
  try { const m = location.hash.match(/^#p(\d+)$/); if (m) passo = Math.min(PASSOS, +m[1]); } catch(e){}
  render(true);
})();
</script>
