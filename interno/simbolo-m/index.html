function drawBlock(b,st,dx,dy,a,C){ctx.globalAlpha=a;const cp=cellPoly(b);
 if(st==='f'){ctx.fillStyle=C.fg;ctx.beginPath();path(cp,dx,dy);ctx.fill()}
 else if(st==='o'){ctx.strokeStyle=C.o;ctx.lineWidth=7.6;ctx.lineJoin='miter';ctx.beginPath();path(cp,dx,dy,.81,b.c);ctx.stroke()}
 else{ctx.fillStyle=C.d;ctx.beginPath();path(cp,dx,dy,.28,b.c);ctx.fill()}
 ctx.globalAlpha=1}
// câmera: do símbolo para o logo completo
const K=206.44/1015, LX=SYM_R-273.14/K, LY=115-210.69/K;
const V1={x:(295+SYM_R)/2,y:622,s:600/1015}, xEnd=SYM_R+(1101.3-273.14)/K, V2={x:(295+xEnd)/2,y:622,s:1300/(xEnd-295)};
let comLogo=false;
const T_MONTA=4200,T_APRENDE=1800,T_FECHA=2000,T_CAM=1500,T_WM=1300,T_FIM=3400,T_SAI=900;
const T_SOLIDO=T_MONTA+T_APRENDE+T_FECHA;
const T_LOGO=()=>T_SOLIDO+(comLogo?T_CAM+T_WM:0), TOTAL=()=>T_LOGO()+T_FIM+T_SAI;
const fase=document.getElementById('fase');let faseTxt='';function setFase(t){if(t!==faseTxt){fase.textContent=t;faseTxt=t}}
const borda=B.filter(b=>b.c[0]>830);
B.forEach(b=>{b.fo=Math.max(0,(b.c[0]-BR))/(SYM_R-BR)*.55+((b.c[1]*7919)%97)/97*.15});
function learnState(b,ms,seed,count,gap){const r=rng(seed);for(let i=0;i<count;i++){const x=borda[Math.floor(r()*borda.length)];const at=i*gap+r()*gap*.4;if(x===b&&ms>at&&ms<at+520)return b.k==='f'?'o':b.k==='o'?'f':'o'}return b.k}
const REF=RAW.B.find(b=>b.k==='f'&&b.c[0]>800);const REL=REF.p.map(([x,y])=>[x-REF.c[0],y-REF.c[1]]);
function cellPoly(b){return b.k==='f'?b.p:REL.map(([x,y])=>[x+b.c[0],y+b.c[1]])}
// polígono "fechado": cada bloco cresce só na direção de um vizinho, para a silhueta externa não mudar
const S0=1015/(810.43-55.79),PR=[36.61*S0,16.84*S0],PD=[0,36.61*S0],GX=3.94*S0+.8,GY=3.94*S0+.8;
const has=(x,y)=>B.some(o=>Math.abs(o.c[0]-x)<8&&Math.abs(o.c[1]-y)<8);
B.forEach(b=>{const p=cellPoly(b).map(q=>q.slice());const r=has(b.c[0]+PR[0],b.c[1]+PR[1]),d=has(b.c[0],b.c[1]+PD[1]);
 if(r){p[1][0]+=GX;p[1][1]+=GX*SL;p[2][0]+=GX;p[2][1]+=GX*SL}
 if(d){p[2][1]+=GY;p[3][1]+=GY}
 b.ext=p});
function frame(ms){
 const C=COL();
 let cam=V1;const tc=T_SOLIDO;
 if(comLogo&&ms>tc){const p=ease(Math.min(1,(ms-tc)/T_CAM));cam={x:V1.x+(V2.x-V1.x)*p,y:V1.y+(V2.y-V1.y)*p,s:Math.exp(Math.log(V1.s)+(Math.log(V2.s)-Math.log(V1.s))*p)}}
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
 let fadeAll=1;if(ms>T_LOGO()+T_FIM)fadeAll=1-Math.min(1,(ms-T_LOGO()-T_FIM)/T_SAI);
 ctx.setTransform(DPR*cam.s,0,0,DPR*cam.s,DPR*(W/2-cam.x*cam.s),DPR*(H/2-cam.y*cam.s));
 ctx.fillStyle=C.fg;ctx.beginPath();path(RAW.real);ctx.fill();
 if(ms<T_MONTA){setFase('Montando');const t=ms/T_MONTA;
  for(const b of B){const p=Math.max(0,Math.min(1,(t-b.t0)/(b.dur*.62)));if(p<=0)continue;const e=ease(p);
   const st=p>=1?b.k:(p<.4?'d':'o');drawBlock(b,st,b.ox*(1-e),b.oy*(1-e),p<.15?p/.15:1,C)}}
 else if(ms<T_MONTA+T_APRENDE){setFase('Aprendendo');const h=ms-T_MONTA;
  for(const b of B)drawBlock(b,learnState(b,h,91,4,420),0,0,1,C)}
 else{
  const t=Math.min(1,(ms-T_MONTA-T_APRENDE)/T_FECHA);
  setFase(t<1?'Completando':(comLogo&&ms<T_LOGO()?'Completando o logo':'Mimetica'));
  // 1) cada bloco vira cheio, da ponte para fora  2) as frestas se fecham
  const close=ease(Math.max(0,Math.min(1,(t-.62)/.38)));
  const solid=new Path2D();path2(solid,RAW.real);
  for(const b of B){
   const p=ease(Math.max(0,Math.min(1,(t-b.fo)/.32)));
   const poly=cellPoly(b),sc=1+.14*close;
   if(b.k!=='f'&&p<1){ // estado antigo sumindo
     drawBlock(b,b.k,0,0,1-p,C);
     ctx.globalAlpha=p;ctx.fillStyle=C.fg;ctx.beginPath();path(poly,0,0,b.k==='d'?.28+.72*p:1,b.c);ctx.fill();ctx.globalAlpha=1}
   else{path2(solid,poly.map((q,i)=>[q[0]+(b.ext[i][0]-q[0])*close,q[1]+(b.ext[i][1]-q[1])*close]))}
  }
  ctx.fillStyle=C.fg;ctx.fill(solid,'nonzero');
 }
 if(comLogo&&ms>T_SOLIDO+T_CAM*.55){const t=(ms-(T_SOLIDO+T_CAM*.55))/(T_WM+T_CAM*.45);
  ctx.save();ctx.transform(1/K,0,0,1/K,LX,LY);ctx.fillStyle=C.wm;
  WM.forEach((w,i)=>{const p=Math.max(0,Math.min(1,(t-i*.07)/.4));if(p<=0)return;ctx.globalAlpha=ease(p);ctx.save();ctx.translate(0,(1-ease(p))*14);ctx.fill(w.p);ctx.restore()});
  ctx.restore();ctx.globalAlpha=1}
 if(fadeAll<1){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1-fadeAll;ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing=!reduce,start=performance.now(),pausedAt=0,last=0;
const bP=document.getElementById('bPlay'),bL=document.getElementById('bLoop');
function clock(now){let ms=now-start;if(loop)ms=ms%TOTAL();else if(ms>T_LOGO()+T_FIM-1){ms=T_LOGO()+T_FIM-1}return ms}
function tick(now){if(playing){last=clock(now);frame(last)}requestAnimationFrame(tick)}
if(reduce){last=T_LOGO()+10;frame(last);bP.textContent='Tocar'}
requestAnimationFrame(tick);
bP.onclick=()=>{playing=!playing;if(playing){start=performance.now()-pausedAt;bP.textContent='Pausar'}else{pausedAt=performance.now()-start;bP.textContent='Tocar'}};
document.getElementById('bRe').onclick=()=>{start=performance.now();pausedAt=0;if(!playing){playing=true;bP.textContent='Pausar'}};
bL.onclick=()=>{loop=!loop;bL.setAttribute('aria-pressed',loop);bL.textContent=loop?'Parar no logo':'Repetir em loop';start=performance.now()-last};
document.getElementById('bLogo').onclick=e=>{comLogo=!comLogo;e.target.setAttribute('aria-pressed',comLogo);e.target.textContent=comLogo?'Só o símbolo':'Com logotipo';start=performance.now();if(!playing){playing=true;bP.textContent='Pausar'}};
document.getElementById('bFundo').onclick=e=>{claro=!claro;document.body.classList.toggle('claro',claro);e.target.textContent=claro?'Fundo preto':'Fundo osso';if(!playing)frame(last)};
</script>
</body></html>
